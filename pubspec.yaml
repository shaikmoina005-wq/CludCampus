name: cludcampus
description: CludCampus — college companion Android MVP for Indian degree campuses.
publish_to: 'none'
version: 1.1.7+12

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  razorpay_flutter: ^1.4.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon_white.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/icon_white_foreground.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
